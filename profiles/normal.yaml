name: normal
description: Pragmatic defaults for maintained personal applications.
policy:
  github:
    require_issue_for_nontrivial_work: false
    require_pull_request_for_nontrivial_work: false
  planning:
    required_for_nontrivial_work: false
  verification:
    fresh_context_for_nontrivial_work: true
    separate_review_for_nontrivial_work: true
    full_check_required: false
  testing:
    meaningful_changes_require_tests: true
    bug_fixes_require_regression_tests: true

