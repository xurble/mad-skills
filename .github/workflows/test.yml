name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run test suite
        run: ./scripts/test
